name: Dependabot auto-merge

# pull_request_target runs with a write token in the context of the base
# branch, which is what lets this job merge. That is only safe because the
# job never checks out or executes anything from the PR head. Do not add an
# actions/checkout step or run PR-supplied code here.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    name: Auto-merge patch and minor updates
    runs-on: ubuntu-latest
    permissions:
      contents: write       # enable auto-merge
      pull-requests: write

    # Only run on Dependabot PRs
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch and minor bumps across all ecosystems.
      # Major version bumps are left for manual review.
      - name: Auto-merge patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
