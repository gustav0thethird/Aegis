apiVersion: v2
name: aegis
description: Vendor-agnostic secrets broker and PAM gateway. Scoped API keys per team, any vault, every action logged.
type: application
# Chart version and appVersion are independent. Bump `version` whenever
# templates or values change (ct enforces this on PRs); `appVersion` tracks the
# image and is overridden at release time from the git tag.
version: 0.4.0
appVersion: "0.3.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/gustav0thethird/Aegis
icon: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/Aegis-logo.png
sources:
  - https://github.com/gustav0thethird/Aegis
keywords:
  - secrets
  - secrets-management
  - pam
  - vault
  - cyberark
  - conjur
  - aws-secrets-manager
  - external-secrets
  - audit
maintainers:
  - name: gustav0thethird
    url: https://github.com/gustav0thethird
annotations:
  artifacthub.io/license: AGPL-3.0
  artifacthub.io/category: security
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/gustav0thethird/Aegis/blob/main/SECURITY.md
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/gustav0thethird/Aegis#kubernetes-and-argo-cd
    - name: Security policy
      url: https://github.com/gustav0thethird/Aegis/blob/main/SECURITY.md
    - name: Container image
      url: https://github.com/gustav0thethird/Aegis/pkgs/container/aegis
  artifacthub.io/images: |
    - name: aegis
      image: ghcr.io/gustav0thethird/aegis:v0.3.0
  artifacthub.io/screenshots: |
    - title: Admin dashboard - estate overview, objects by vendor, recent changes
      url: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/screenshots/admin-dashboard.png
    - title: Objects - atomic secret definitions across CyberArk, Vault, AWS and Conjur
      url: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/screenshots/objects.png
    - title: Registries - named collections of objects that teams are granted against
      url: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/screenshots/registries.png
    - title: Teams - scoped API keys, one per team-registry pair
      url: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/screenshots/teams.png
    - title: Audit log - every fetch and change, attributed and queryable
      url: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/screenshots/audit-log.png
    - title: Interactive API documentation
      url: https://raw.githubusercontent.com/gustav0thethird/Aegis/main/static/assets/screenshots/api-docs.png
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: the key.rotated webhook no longer carries the plaintext key (config.webhookIncludeRotatedKey restores it)"
    - kind: changed
      description: "Breaking: whole-registry ESO extraction is off by default (config.esoAllowRegistryExtract enables it)"
    - kind: fixed
      description: Chart appVersion now tracks the released image (was 0.2.0, so a local install defaulted to the old image)
    - kind: added
      description: Screenshots on the Artifact Hub listing
    - kind: added
      description: Generated admin password when secret.adminPassword is empty, stable across upgrades
    - kind: added
      description: externalSecrets.credentials and externalSecrets.authJson materialise the chart's own Secrets from an external store
    - kind: added
      description: secret.adminPasswordSync=always makes a rotated Secret rotate the admin password
    - kind: changed
      description: Admin password reaches the pod as a mounted file (ADMIN_PASSWORD_FILE), not an environment variable
    - kind: added
      description: Chart published as a signed OCI artifact to ghcr.io/gustav0thethird/charts/aegis
    - kind: added
      description: values.schema.json validates user values at install time
    - kind: added
      description: Optional secret-key entry for the scan-finding dedupe hash
    - kind: changed
      description: Chart moved from helm/ to charts/aegis/
