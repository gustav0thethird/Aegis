<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis — My Team</title>
<link rel="stylesheet" href="/static/css/dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <header id="topbar">
    <div class="topbar-logo">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <span style="font-size:14px;font-weight:600;color:var(--text-1)">Aegis</span>
    <span style="font-size:11px;color:var(--text-3);padding:2px 8px;border:1px solid var(--border);border-radius:4px;">User</span>
    <span style="flex:1"></span>
    <span style="font-size:11px;color:var(--text-3)">Signed in as <span id="topbar-name" style="color:var(--text-2);font-weight:500"></span></span>
    <a href="/docs" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">Docs</a>
    <button class="btn btn-ghost btn-sm" data-act="signOut">Sign out</button>
  </header>

  <!-- Page body -->
  <main id="main" style="display:none">

    <!-- Page header -->
    <div style="margin-bottom:20px" class="fade-in">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
        <h1 style="font-size:20px;font-weight:600;color:var(--text-1)" id="team-heading">My Team</h1>
        <span id="team-badge" class="badge-count" style="display:none"></span>
      </div>
      <div id="team-id-row" style="display:none;align-items:center;gap:8px;margin-top:4px">
        <span style="font-size:10px;color:var(--text-3)">Team ID:</span>
        <code id="team-id-val" style="font-size:10px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:1px 6px;"></code>
        <button data-act="copyTeamId" style="background:none;border:1px solid var(--border);border-radius:3px;color:var(--text-3);cursor:pointer;font-size:9px;padding:1px 5px;font-family:'Fira Code',monospace;">copy</button>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;">
      <button id="tab-overview" data-act="switchTab" data-args='["overview"]' class="dash-tab dash-tab-active">Overview</button>
      <button id="tab-webhooks" data-act="switchTab" data-args='["webhooks"]' class="dash-tab">Webhooks</button>
      <button id="tab-activity" data-act="switchTab" data-args='["activity"]' class="dash-tab">Activity</button>
    </div>

    <!-- Error banner -->
    <div id="err-banner" style="display:none;background:var(--danger-lo);border:1px solid rgba(239,68,68,0.3);border-radius:7px;padding:12px 16px;font-size:12px;color:var(--danger);margin-bottom:20px"></div>

    <!-- ── Overview tab ── -->
    <div id="pane-overview">
      <!-- Stat cards -->
      <div id="stats-row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;display:none">
        <div class="stat-card accent-indigo">
          <div class="section-label">Registries</div>
          <div style="font-size:28px;font-weight:600;color:var(--text-1);margin:6px 0 4px" id="stat-regs">—</div>
          <div style="font-size:11px;color:var(--text-3)">assigned to your team</div>
        </div>
        <div class="stat-card accent-emerald">
          <div class="section-label">Active Keys</div>
          <div style="font-size:28px;font-weight:600;color:var(--success);margin:6px 0 4px" id="stat-keys">—</div>
          <div style="font-size:11px;color:var(--text-3)">credentials available</div>
        </div>
        <div class="stat-card accent-amber">
          <div class="section-label">Expiring Soon</div>
          <div style="font-size:28px;font-weight:600;color:var(--warning);margin:6px 0 4px" id="stat-expiring">—</div>
          <div style="font-size:11px;color:var(--text-3)">within 30 days</div>
        </div>
        <div class="stat-card">
          <div class="section-label">Requests</div>
          <div style="font-size:28px;font-weight:600;color:var(--text-1);margin:6px 0 4px" id="stat-requests">—</div>
          <div style="font-size:11px;color:var(--text-3)">total API calls</div>
        </div>
      </div>
      <!-- Registry cards -->
      <div id="content">
        <div style="text-align:center;padding:64px 24px;color:var(--text-3);font-size:12px">Loading…</div>
      </div>
    </div>

    <!-- ── Webhooks tab ── -->
    <div id="pane-webhooks" style="display:none">
      <div id="wh-content">
        <div style="text-align:center;padding:64px 24px;color:var(--text-3);font-size:12px">Loading…</div>
      </div>
    </div>

    <!-- ── Activity tab ── -->
    <div id="pane-activity" style="display:none">
      <div id="act-content">
        <div style="text-align:center;padding:64px 24px;color:var(--text-3);font-size:12px">Loading…</div>
      </div>
    </div>

  </main>
</div>


<script src="/static/js/actions.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
