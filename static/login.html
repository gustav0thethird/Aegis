<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="logo-title">Aegis</div>
    <div class="logo-sub">Secrets Broker</div>
  </div>

  <div class="field">
    <label for="u">Username</label>
    <input id="u" type="text" placeholder="username" autocomplete="username"
           data-act-keydown="submitOnEnter" data-args='["login"]'>
  </div>
  <div class="field">
    <label for="p">Password</label>
    <input id="p" type="password" placeholder="••••••••" autocomplete="current-password"
           data-act-keydown="submitOnEnter" data-args='["login"]'>
  </div>

  <div class="err" id="err"></div>

  <button id="btn" data-act="login">Sign In</button>

  <div class="footer">
    <a href="/docs">API docs</a> &nbsp;·&nbsp; Aegis v2
  </div>
</div>

<script src="/static/js/actions.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
