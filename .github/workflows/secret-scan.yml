# Reusable secret-scanning workflow.
#
# Call this from any repository to run Gitleaks and Semgrep and report the
# results to Aegis, which deduplicates the findings and raises a ticket or
# alert for anything new at or above the configured severity.
#
# Caller example: examples/ci/github-actions-secret-scan.yml

name: Secret scan

on:
  workflow_call:
    inputs:
      aegis-url:
        description: Base URL of the Aegis deployment
        required: true
        type: string
      team-id:
        description: Aegis team UUID that owns this repository
        required: true
        type: string
      fail-on-findings:
        description: Fail the job when a secret is detected
        required: false
        default: true
        type: boolean
      semgrep-config:
        description: Semgrep ruleset
        required: false
        default: p/secrets
        type: string
    secrets:
      aegis-token:
        description: The team's Aegis inbound webhook secret
        required: true

jobs:
  scan:
    name: Scan and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks inspects history, not just the working tree — a credential
          # that was committed and then deleted is still a leaked credential.
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect \
            --source /repo --report-format json --report-path /repo/gitleaks.json \
            --exit-code 0 --redact
          test -f gitleaks.json || echo '[]' > gitleaks.json

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          pip install --quiet semgrep
          semgrep --config ${{ inputs.semgrep-config }} --json --quiet \
            --output semgrep.json . || true
          test -f semgrep.json || echo '{"results":[]}' > semgrep.json

      - name: Report to Aegis
        id: report
        env:
          AEGIS_URL: ${{ inputs.aegis-url }}
          TEAM_ID: ${{ inputs.team-id }}
          AEGIS_TOKEN: ${{ secrets.aegis-token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          endpoint = f"{os.environ['AEGIS_URL'].rstrip('/')}/api/scan/{os.environ['TEAM_ID']}/ingest"
          common = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ.get("GITHUB_REF", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "source": "github-actions",
          }

          total_new = 0
          for scanner, path in (("gitleaks", "gitleaks.json"), ("semgrep", "semgrep.json")):
              try:
                  with open(path) as fh:
                      results = json.load(fh)
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"::warning::could not read {path}: {exc}")
                  continue

              body = json.dumps({**common, "scanner": scanner, "results": results}).encode()
              request = urllib.request.Request(
                  endpoint, data=body, method="POST",
                  headers={"Content-Type": "application/json",
                           "Authorization": f"Bearer {os.environ['AEGIS_TOKEN']}"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as resp:
                      payload = json.load(resp)
              except Exception as exc:
                  # Reporting is not the gate. A findings count of zero must mean
                  # "nothing was found", never "Aegis was unreachable", so a
                  # transport failure is surfaced and the local check still runs.
                  print(f"::warning::reporting {scanner} to Aegis failed: {exc}")
                  continue

              print(f"{scanner}: {payload['findings']} findings, "
                    f"{payload['new_findings']} new, "
                    f"{payload.get('alerts_queued', 0)} queued for alerting")
              if payload.get("alert_errors"):
                  print(f"::warning::alert delivery errors: {payload['alert_errors']}")
              total_new += payload["new_findings"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"new-findings={total_new}\n")
          PY

      - name: Fail if secrets were detected
        if: inputs.fail-on-findings && steps.report.outputs.new-findings != '0'
        run: |
          echo "::error::${{ steps.report.outputs.new-findings }} new secret(s) detected. See Aegis for detail."
          exit 1
