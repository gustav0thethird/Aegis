# Pull an entire registry in one call.
#
# Uses a second ClusterSecretStore whose URL targets /eso/v1/secrets and whose
# jsonPath is $.data, so ESO receives a map and materialises every object in the
# registry as a key in the resulting Secret. Convenient, but it grants the
# workload everything in the registry — prefer the per-key form where the
# workload only needs a few values.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aegis-registry
spec:
  provider:
    webhook:
      url: "http://aegis.aegis.svc.cluster.local:8080/eso/v1/secrets"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .apiKey }}"
        X-Change-Number: "ESO-SYNC"
      result:
        jsonPath: "$.data"
      secrets:
        - name: apiKey
          secretRef:
            name: aegis-eso-credentials
            namespace: external-secrets
            key: api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-all
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis-registry
  target:
    name: payments-all
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: registry
