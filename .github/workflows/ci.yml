name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**", "chore/**", "refactor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check aegis/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       aegis_test
          POSTGRES_USER:     broker
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:   postgresql://broker:changeme@localhost:5432/aegis_test
      ADMIN_PASSWORD: test-admin-pass
      SECRET_KEY:     test-secret-key-32-chars-xyzxyzxy
      AUTH_PATH:      config/auth.json
      REDIS_URL:      redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Create auth.json for tests
        run: cp config/auth.json.example config/auth.json

      - name: Run tests
        run: pytest tests/ -v --tb=short

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # ct compares against main to enforce the version bump

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # helm lint (with values.schema.json), YAML lint, maintainers, and a
      # Chart.yaml version bump on any chart change.
      - name: ct lint
        run: ct lint --config ct.yaml --all

      - name: Chart README is current (helm-docs)
        run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" \
            jnorwood/helm-docs:v1.14.2 --chart-search-root=charts
          git diff --exit-code -- charts/ \
            || { echo "::error::charts/aegis/README.md is stale - run 'make helm-docs' and commit"; exit 1; }

      - name: Render with defaults
        run: |
          helm template aegis charts/aegis \
            --set auth.existingSecret=aegis-auth-json \
            --set secret.existingSecret=aegis-credentials \
            > /tmp/render-default.yaml
          test -s /tmp/render-default.yaml

      - name: Render with every optional feature enabled
        run: |
          helm template aegis charts/aegis \
            --set auth.existingSecret=aegis-auth-json \
            --set secret.existingSecret=aegis-credentials \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set externalSecrets.clusterSecretStore.enabled=true \
            > /tmp/render-all.yaml
          test -s /tmp/render-all.yaml

      - name: Render each migration hook provider
        run: |
          for provider in argocd helm none; do
            helm template aegis charts/aegis \
              --set auth.existingSecret=aegis-auth-json \
              --set secret.existingSecret=aegis-credentials \
              --set migrations.hookProvider=$provider > /dev/null
          done

      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          # CRDs (ServiceMonitor, ClusterSecretStore) are not in the stock
          # schema set, so missing schemas are ignored rather than failing.
          /tmp/kubeconform -strict -ignore-missing-schemas -summary /tmp/render-all.yaml

      - name: Validate Argo CD manifests parse
        run: |
          python3 -c "
          import yaml, pathlib, sys
          for p in pathlib.Path('argocd').rglob('*.yaml'):
              docs = [d for d in yaml.safe_load_all(p.read_text()) if d]
              assert docs, f'{p} is empty'
              for d in docs:
                  assert 'kind' in d, f'{p} missing kind'
              print(p, '->', [d['kind'] for d in docs])
          "

  chart-install:
    name: Chart install
    runs-on: ubuntu-latest
    # Rendering is cheap and proves syntax; this proves the chart actually
    # brings the broker up: image built from this commit, real Postgres and
    # Redis, migration hook Job, then the startup/readiness probes going green.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Only when the chart, image or app changed
        id: changed
        run: |
          if ct list-changed --config ct.yaml | grep -q . \
             || git diff --name-only origin/main...HEAD | grep -qE '^(aegis/|Dockerfile|requirements.txt|alembic/|docker-entrypoint.sh|ct.yaml|.github/workflows/ci.yml)' \
             || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.changed.outputs.run == 'true'
        run: docker build -t ghcr.io/gustav0thethird/aegis:ci .

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        if: steps.changed.outputs.run == 'true'

      - name: Load image and stand up dependencies
        if: steps.changed.outputs.run == 'true'
        run: |
          kind load docker-image ghcr.io/gustav0thethird/aegis:ci --name chart-testing
          kubectl create namespace aegis
          kubectl -n aegis create deployment postgres --image=postgres:16-alpine --port=5432
          kubectl -n aegis set env deployment/postgres POSTGRES_DB=aegis POSTGRES_USER=broker POSTGRES_PASSWORD=changeme
          kubectl -n aegis expose deployment postgres --port=5432
          kubectl -n aegis create deployment redis --image=redis:7-alpine --port=6379
          kubectl -n aegis expose deployment redis --port=6379
          kubectl -n aegis create secret generic aegis-credentials \
            --from-literal=database-url=postgresql://broker:changeme@postgres:5432/aegis \
            --from-literal=redis-url=redis://redis:6379 \
            --from-literal=admin-password=ci-admin-pass \
            --from-literal=secret-key=ci-secret-key-32-chars-xxxxxxxxxx
          kubectl -n aegis create secret generic aegis-auth-json --from-file=auth.json=config/auth.json.example
          kubectl -n aegis rollout status deployment/postgres --timeout=120s
          kubectl -n aegis rollout status deployment/redis --timeout=120s

      # ct install runs helm install (pre-install migration hook included),
      # waits for the release, runs the chart's tests, then uninstalls.
      - name: ct install
        if: steps.changed.outputs.run == 'true'
        run: ct install --config ct.yaml --all --namespace aegis --helm-extra-args "--timeout 300s"

      - name: Diagnostics on failure
        if: failure() && steps.changed.outputs.run == 'true'
        run: |
          kubectl -n aegis get all
          kubectl -n aegis describe pods | tail -80
          kubectl -n aegis logs -l app.kubernetes.io/name=aegis --all-containers --tail=100 || true
          kubectl -n aegis logs -l app.kubernetes.io/component=migrate --tail=100 || true

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # No backend and no credentials: this checks syntax, types and
      # provider schemas, not real infrastructure.
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.64.0

      # Provider-aware lint (see terraform/.tflint.hcl). The token only
      # raises the GitHub API rate limit for downloading the AWS ruleset.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint --format compact

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t aegis:ci .

      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id aegis:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Entrypoint skips migrations when RUN_MIGRATIONS=false
        run: |
          out=$(docker run --rm -e RUN_MIGRATIONS=false aegis:ci echo started)
          echo "$out"
          echo "$out" | grep -q "skipping migrations"
          echo "$out" | grep -q "started"

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit runtime dependencies
        run: |
          pip install pip-audit
          # Fails the build on any known vulnerability in a pinned runtime
          # dependency. Dependabot opens PRs; this makes an unpatched
          # vulnerability visible on every push rather than only in the
          # security tab.
          pip-audit -r requirements.txt --progress-spinner off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan history, not just the working tree: a credential that was
          # committed and later deleted is still a leaked credential.
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --no-banner
