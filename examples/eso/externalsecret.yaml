# Pull individual secrets by name.
#
# remoteRef.key is the Aegis object name. It must belong to the registry the API
# key is bound to; anything else returns 404 and is recorded as a denial.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-api-credentials
  namespace: payments
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aegis
  target:
    name: payments-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payments_db_password
    - secretKey: STRIPE_KEY
      remoteRef:
        key: payments_stripe_key
