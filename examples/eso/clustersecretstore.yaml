# ClusterSecretStore pointing at Aegis.
#
# ESO's generic webhook provider calls Aegis and extracts the value with a JSON
# path. Workloads then reference this store and never hold vault credentials of
# their own — Aegis brokers to Vault, CyberArk, Conjur or AWS on their behalf,
# and every fetch lands in the Aegis audit log attributed to the team key.
#
# The referenced Secret holds an Aegis team-registry API key (the `sk_...` value
# returned when a registry is assigned to a team).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aegis
spec:
  provider:
    webhook:
      url: "http://aegis.aegis.svc.cluster.local:8080/eso/v1/secret/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .apiKey }}"
        X-Change-Number: "ESO-SYNC"
      result:
        jsonPath: "$.value"
      secrets:
        - name: apiKey
          secretRef:
            name: aegis-eso-credentials
            namespace: external-secrets
            key: api-key
