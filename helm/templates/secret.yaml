{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{/*
Development convenience only. In a GitOps repository these values would be
committed to Git in plain text, so production installs should set
secret.existingSecret and manage the Secret with sealed-secrets, SOPS, or the
External Secrets Operator.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  database-url: {{ required "secret.databaseUrl is required when secret.create is true" .Values.secret.databaseUrl | quote }}
  redis-url: {{ required "secret.redisUrl is required when secret.create is true" .Values.secret.redisUrl | quote }}
  admin-password: {{ required "secret.adminPassword is required when secret.create is true" .Values.secret.adminPassword | quote }}
{{- end }}
