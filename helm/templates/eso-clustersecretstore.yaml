{{- if .Values.externalSecrets.clusterSecretStore.enabled }}
{{/*
Emits a ClusterSecretStore that points at this Aegis release, so workloads can
pull brokered secrets through the External Secrets Operator without any further
wiring. ESO's generic webhook provider is used: it calls the Aegis ESO endpoint
and extracts the value with a JSON path.

The referenced Secret must hold an Aegis team-registry API key.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStore.name }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    webhook:
      url: "http://{{ include "aegis.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/eso/v1/secret/{{ `{{ .remoteRef.key }}` }}"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ `{{ .apiKey }}` }}"
        X-Change-Number: {{ .Values.externalSecrets.clusterSecretStore.changeNumber | quote }}
      result:
        jsonPath: "$.value"
      secrets:
        - name: apiKey
          secretRef:
            name: {{ .Values.externalSecrets.clusterSecretStore.apiKeySecret.name }}
            namespace: {{ .Values.externalSecrets.clusterSecretStore.apiKeySecret.namespace }}
            key: {{ .Values.externalSecrets.clusterSecretStore.apiKeySecret.key }}
{{- end }}
