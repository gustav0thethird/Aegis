{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{/*
Chart-managed credentials Secret.

The admin password is generated when secret.adminPassword is empty, and kept
stable across upgrades by reading the existing Secret back (lookup). Under
`helm template` / Argo CD's render there is no cluster to look up, so a new
value would render each time - for GitOps use secret.existingSecret (with
externalSecrets.credentials or sealed-secrets/SOPS) instead.

Read a generated password with:
  kubectl -n <ns> get secret <release> -o jsonpath='{.data.admin-password}' | base64 -d
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "aegis.fullname" .)) }}
{{- $adminPassword := .Values.secret.adminPassword }}
{{- if not $adminPassword }}
  {{- if and $existing $existing.data (index $existing.data "admin-password") }}
    {{- $adminPassword = index $existing.data "admin-password" | b64dec }}
  {{- else }}
    {{- $adminPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Keep the generated password when the release is uninstalled, so a
    # reinstall against the same database can still sign in.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  database-url: {{ required "secret.databaseUrl is required when secret.create is true" .Values.secret.databaseUrl | quote }}
  redis-url: {{ required "secret.redisUrl is required when secret.create is true" .Values.secret.redisUrl | quote }}
  admin-password: {{ $adminPassword | quote }}
  {{- with .Values.secret.secretKey }}
  secret-key: {{ . | quote }}
  {{- end }}
{{- end }}
