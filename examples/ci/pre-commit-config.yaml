# Copy to .pre-commit-config.yaml in a repository, then `pre-commit install`.
#
# Catching a credential before it is committed is worth far more than finding
# it afterwards: once a secret reaches a shared branch it must be treated as
# compromised and rotated, whatever the history rewrite says.
#
# This is a local gate only — it does not report to Aegis. The CI workflow does
# that, so findings are still recorded and ticketed if someone commits with
# --no-verify.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/semgrep/semgrep
    rev: v1.97.0
    hooks:
      - id: semgrep
        args: ["--config", "p/secrets", "--error", "--skip-unknown-extensions"]
