name: Release

on:
  push:
    tags:
      - "v*"
  # Re-publish an existing tag after a workflow fix. Everything is keyed on
  # the tag, so the result is identical to a tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  image:
    name: Image ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create GitHub release
      packages: write        # push to GHCR
      security-events: write # upload Trivy SARIF results
      id-token: write        # keyless cosign signing via Sigstore
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      # OCI repository names must be lowercase; github.repository is not.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # v0.2.1 -> v0.2.1, v0.2, latest. The bare-major tag (v0) is skipped while
      # pre-1.0, where a minor bump may break compatibility.
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern=v{{major}},value=${{ env.RELEASE_TAG }},enable=${{ !startsWith(env.RELEASE_TAG, 'v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Aegis
            org.opencontainers.image.description=Vendor-agnostic secrets broker and PAM gateway
            org.opencontainers.image.vendor=gustav0thethird
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Native-arch build first so Trivy can scan it before anything is pushed.
      - name: Build image (local, pre-scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Same policy as the PR scan in security.yml: block on CVEs that have
          # a fix, not on base-image CVEs Debian has no patch for.
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"   # fail the release if fixable CRITICAL or HIGH CVEs are found

      - name: Upload Trivy results to GitHub Security tab
        if: always()  # upload even if the scan step failed
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release

      - name: Push multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SPDX SBOM and SLSA provenance attestation to the image.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity and
      # recorded in the public Rekor log. Verify with:
      #   cosign verify ghcr.io/gustav0thethird/aegis:<tag> \
      #     --certificate-identity-regexp 'https://github.com/gustav0thethird/Aegis/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    name: Chart
    runs-on: ubuntu-latest
    needs: image   # never publish a chart whose default image does not exist
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Two logins: helm keeps its own registry credentials, cosign reads
      # Docker's. Without the second, the chart pushes but signing fails.
      - name: Log in to GHCR (helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Log in to GHCR (cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chart version comes from Chart.yaml (bumped in the PR that changed the
      # chart - ct enforces it); appVersion is stamped from the git tag so the
      # chart's default image always matches this release.
      - name: Package
        id: pkg
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          chart_version=$(awk '/^version:/ {print $2}' charts/aegis/Chart.yaml)
          repo="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          # A chart version is published once. Re-running the same release
          # (same appVersion) is allowed and re-pushes identical content.
          if existing=$(helm show chart "${repo}/aegis" --version "$chart_version" 2>/dev/null); then
            existing_app=$(echo "$existing" | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}')
            if [ "$existing_app" != "${TAG#v}" ]; then
              echo "::error::chart aegis ${chart_version} is already published for app ${existing_app}; bump charts/aegis/Chart.yaml version"
              exit 1
            fi
            echo "chart ${chart_version} already published for this release - re-publishing"
          fi
          helm package charts/aegis --app-version "${TAG#v}" --destination dist
          echo "version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      - name: Push
        id: helmpush
        run: |
          out=$(helm push "dist/aegis-${{ steps.pkg.outputs.version }}.tgz" "${{ steps.pkg.outputs.repo }}" 2>&1)
          echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/ {print $2}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Verify with:
      #   cosign verify ghcr.io/gustav0thethird/charts/aegis:<chart version> \
      #     --certificate-identity-regexp 'https://github.com/gustav0thethird/Aegis/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign chart
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/aegis@${{ steps.helmpush.outputs.digest }}"


  # Install the chart exactly as a stranger would - from the registry, into a
  # clean cluster. ci.yml tests the chart in the working tree; this tests what
  # was actually published.
  verify:
    name: Verify published chart
    needs: chart
    uses: ./.github/workflows/chart-smoke.yml
    with:
      chart_version: ${{ needs.chart.outputs.version }}
