{{/*
Aegis as an External Secrets Operator CONSUMER: its own credentials and
auth.json materialised from an external store (Vault, AWS Secrets Manager,
1Password, ... whatever the referenced SecretStore points at).

  externalSecrets.credentials -> Secret {{ include "aegis.secretName" . }}
  externalSecrets.authJson    -> Secret auth.existingSecret

Rotation: ESO rewrites the Secret on refreshInterval. Environment variables
are read at pod start, so set ADMIN_PASSWORD_SYNC=always (secret.adminPasswordSync)
and roll the Deployment (or annotate it for Reloader) to apply a rotated
admin password. The database and Redis URLs likewise apply on the next roll.

Not to be confused with externalSecrets.clusterSecretStore, which is the
opposite direction: Aegis acting as a PROVIDER to ESO.
*/}}
{{- with .Values.externalSecrets.credentials }}
{{- if .enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aegis.fullname" $ }}-credentials
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.credentials.secretStoreRef.name is required" .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind }}
  target:
    name: {{ include "aegis.secretName" $ }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $ref := .remoteRefs }}
    {{- if $ref.key }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- with .Values.externalSecrets.authJson }}
{{- if .enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aegis.fullname" $ }}-auth-json
  labels:
    {{- include "aegis.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.authJson.secretStoreRef.name is required" .secretStoreRef.name }}
    kind: {{ .secretStoreRef.kind }}
  target:
    name: {{ required "auth.existingSecret must name the Secret externalSecrets.authJson creates" $.Values.auth.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $.Values.auth.secretKey }}
      remoteRef:
        key: {{ required "externalSecrets.authJson.remoteRef.key is required" .remoteRef.key | quote }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
{{- end }}
{{- end }}
