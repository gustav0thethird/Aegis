# Drop this into any repository as .github/workflows/secret-scan.yml.
#
# It calls the reusable workflow that Aegis publishes, so the scanner versions
# and reporting logic stay in one place rather than being copied into every
# repository and drifting.
#
# Setup:
#   1. In Aegis, enable the team's inbound webhook and copy its signing secret.
#   2. Add that value as the repository secret AEGIS_TOKEN.
#   3. Replace the team-id below with the team's UUID.

name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch credentials committed before scanning was switched on, and rules
    # that only started matching after a scanner update.
    - cron: "0 3 * * 1"

jobs:
  secret-scan:
    uses: gustav0thethird/Aegis/.github/workflows/secret-scan.yml@main
    with:
      aegis-url: https://aegis.example.com
      team-id: 00000000-0000-0000-0000-000000000000
      fail-on-findings: true
    secrets:
      aegis-token: ${{ secrets.AEGIS_TOKEN }}
